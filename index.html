<!DOCTYPE html><html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЭЛЕКТРИЧЕК — Расписание электричек</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f5f9;
  color: #172033;
}
header {
  background: #1769d2;
  color: white;
  padding: 22px 16px;
}
header h1 { margin: 0 0 8px; font-size: 27px; }
header p { margin: 0; }
main { max-width: 760px; margin: auto; padding: 18px; }
.panel {
  background: white;
  padding: 18px;
  border-radius: 14px;
  margin-bottom: 16px;
}
h2 { margin-top: 0; font-size: 20px; }
label { display: block; margin: 14px 0 6px; font-weight: bold; }
input, button {
  width: 100%;
  padding: 13px;
  border-radius: 9px;
  font-size: 16px;
}
input { border: 1px solid #cbd3df; }
button {
  border: 0;
  background: #1769d2;
  color: white;
  font-weight: bold;
  margin-top: 12px;
}
button:disabled { opacity: .6; }
#status { margin-top: 12px; color: #596579; }
.result {
  border-top: 1px solid #e2e7ef;
  padding: 13px 0;
}
.time { font-size: 20px; font-weight: bold; }
.muted { color: #657187; font-size: 14px; margin-top: 5px; }
</style>
</head>
<body>
<header>
  <h1>🚆 ЭЛЕКТРИЧЕК</h1>
  <p>Расписание пригородных поездов Москвы и МЦД</p>
</header><main>
  <section class="panel">
    <h2>Найти электричку</h2>
    <label for="from">Откуда</label>
    <input id="from" list="stations" placeholder="Например, Подольск">
    <label for="to">Куда</label>
    <input id="to" list="stations" placeholder="Например, Курский вокзал">
    <datalist id="stations"></datalist>
    <label for="date">Дата поездки</label>
    <input id="date" type="date">
    <button id="search">Найти поезда</button>
    <div id="status">Подключение к серверу…</div>
  </section>  <section class="panel">
    <h2>Результаты</h2>
    <div id="results">Укажи станции отправления и прибытия.</div>
  </section>
</main><script>
const API = "https://electrichesk-moscow.onrender.com/api";
const fromInput = document.getElementById("from");
const toInput = document.getElementById("to");
const stationList = document.getElementById("stations");
const statusBox = document.getElementById("status");
const results = document.getElementById("results");
const searchButton = document.getElementById("search");

document.getElementById("date").value =
  new Date().toLocaleDateString("en-CA");

let stations = [];

async function loadStations() {
  try {
    statusBox.textContent = "Загружаем список станций…";
    const response = await fetch(API + "/stations");
    if (!response.ok) throw new Error("Ошибка сервера: " + response.status);
    const data = await response.json();
    stations = Array.isArray(data) ? data : (data.stations || []);
    stationList.replaceChildren();

    stations.forEach(station => {
      const option = document.createElement("option");
      option.value = station.title || station.name || "";
      if (option.value) stationList.appendChild(option);
    });

    statusBox.textContent = "Список станций загружен: " + stations.length;
  } catch (error) {
    statusBox.textContent =
      "Не удалось загрузить станции. Проверь подключение сервера.";
  }
}

searchButton.addEventListener("click", async () => {
  const fromText = fromInput.value.trim();
  const toText = toInput.value.trim();
  const date = document.getElementById("date").value;

  if (!fromText || !toText) {
    statusBox.textContent = "Укажи обе станции.";
    return;
  }

  const fromStation = stations.find(s =>
    (s.title || s.name || "").toLowerCase() === fromText.toLowerCase()
  );
  const toStation = stations.find(s =>
    (s.title || s.name || "").toLowerCase() === toText.toLowerCase()
  );

  if (!fromStation || !toStation) {
    statusBox.textContent =
      "Выбери станции из подсказок или проверь их названия.";
    return;
  }

  const fromCode = fromStation.codes?.yandex_code || fromStation.code;
  const toCode = toStation.codes?.yandex_code || toStation.code;

  if (!fromCode || !toCode) {
    statusBox.textContent = "Для станции не найден код.";
    return;
  }

  searchButton.disabled = true;
  results.textContent = "Ищем расписание…";
  statusBox.textContent = "Запрашиваем расписание…";

  try {
    const params = new URLSearchParams({
      from: fromCode,
      to: toCode,
      date: date,
      lang: "ru_RU"
    });
    const response = await fetch(API + "/search?" + params.toString());
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Ошибка запроса");
    }

    const segments = data.segments || [];
    results.replaceChildren();

    if (!segments.length) {
      results.textContent =
        "Поезда не найдены. Проверь станции и дату поездки.";
    } else {
      segments.forEach(segment => {
        const item = document.createElement("div");
        item.className = "result";

        const departure = segment.departure
          ? new Date(segment.departure).toLocaleTimeString("ru-RU", {
              hour: "2-digit", minute: "2-digit"
            })
          : "—";
        const arrival = segment.arrival
          ? new Date(segment.arrival).toLocaleTimeString("ru-RU", {
              hour: "2-digit", minute: "2-digit"
            })
          : "—";

        const title = document.createElement("div");
        title.className = "time";
        title.textContent = departure + " → " + arrival;

        const name = document.createElement("div");
        name.textContent = segment.thread?.title ||
          segment.thread?.short_title || "Пригородный поезд";

        const detail = document.createElement("div");
        detail.className = "muted";
        detail.textContent =
          (segment.duration ? "В пути: " +
          Math.round(segment.duration / 60) + " мин." : "");

        item.append(title, name, detail);
        results.appendChild(item);
      });
    }

    statusBox.textContent = "Поиск завершён.";
  } catch (error) {
    results.textContent = "Не удалось получить расписание.";
    statusBox.textContent =
      "Ошибка подключения или ответа API. " + error.message;
  } finally {
    searchButton.disabled = false;
  }
});

loadStations();
</script><
/body>
</html>
